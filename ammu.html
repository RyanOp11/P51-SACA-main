<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AMMU</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #f2f2f2;
    margin: 0;
    padding: 20px;
  }

  h1 {
    text-align: center;
    color: #333;
  }

  #chat {
    max-width: 500px;
    margin: 0 auto;
    background: #fff;
    border: 1px solid #ccc;
    height: 400px;
    overflow-y: auto;
    padding: 12px;
    border-radius: 6px;
  }

  .msg {
    margin: 8px 0;
    padding: 10px;
    border-radius: 6px;
    white-space: pre-wrap;
    max-width: 85%;
  }

  .user {
    background: #d9edff;
    margin-left: auto;
    text-align: right;
  }

  .ammu {
    background: #eee;
  }

  #examples {
    max-width: 500px;
    margin: 10px auto 0 auto;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .chip {
    background: #fff;
    border: 1px solid #ccc;
    border-radius: 16px;
    padding: 6px 12px;
    font-size: 13px;
    color: #333;
    cursor: pointer;
  }

  .chip:hover {
    background: #e0f2f1;
    border-color: #009688;
  }

  #bottom {
    max-width: 500px;
    margin: 10px auto;
    display: flex;
    gap: 8px;
  }

  #input {
    flex: 1;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 6px;
  }

  #send {
    padding: 10px 16px;
    border: none;
    background: #009688;
    color: #fff;
    border-radius: 6px;
    cursor: pointer;
  }

  .hint {
    max-width: 500px;
    margin: 0 auto 10px auto;
    font-size: 13px;
    color: #777;
    text-align: center;
  }
</style>
</head>
<body>

<h1>AMMU</h1>
<p class="hint">Type how you feel, or tap an example below</p>

<div id="chat"></div>

<div id="examples"></div>

<div id="bottom">
  <input id="input" placeholder="Say how you feel...">
  <button id="send">Send</button>
</div>

<script>
// now we just talk to the server, no logic here
const API = "/ammu/respond";

const chat = document.getElementById("chat");
const input = document.getElementById("input");

// example lines people can tap
const examples = [
  "ana homa na maumivu ya kichwa",
  "ana kikohozi na kupumua haraka",
  "ana homa na degedege",
  "ana kikohozi kidogo"
];

// color for each level
const colors = {
  LOW: "#2e7d32",
  MEDIUM: "#e6b800",
  HIGH: "#d32f2f",
  CRITICAL: "#7a0000"
};

// build the example chips
const examplesBox = document.getElementById("examples");
for (const ex of examples) {
  const chip = document.createElement("div");
  chip.className = "chip";
  chip.textContent = ex;
  chip.onclick = function() {
    input.value = ex;
    send();
  };
  examplesBox.appendChild(chip);
}

function addMessage(text, who, color) {
  const div = document.createElement("div");
  div.className = "msg " + who;
  if (color) {
    div.style.borderLeft = "6px solid " + color;
  }
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

async function send() {
  const text = input.value;

  // show the user message (only if they typed something)
  if (text.trim() !== "") {
    addMessage(text, "user");
  }
  input.value = "";

  const thinking = addMessage("Let me check that for you...", "ammu");

  try {
    const res = await fetch(API, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ user_text: text })
    });
    const data = await res.json();
    thinking.remove();

    // pick a color if the server gave a severity
    let color = null;
    if (data.severity) {
      color = colors[data.severity];
    }

    addMessage(data.reply, "ammu", color);

  } catch (e) {
    thinking.remove();
    addMessage("I could not connect to the server. Make sure it is running (uvicorn main:app --reload).", "ammu");
  }
}

document.getElementById("send").onclick = send;

input.addEventListener("keydown", function(e) {
  if (e.key === "Enter") {
    send();
  }
});
</script>

</body>
</html>
